name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: mypy src
      - run: workflow-sentinel --sarif fixtures/vulnerable/findings.sarif --repo fixtures/vulnerable > /tmp/report.json
      - run: python -m pip install zizmor==1.30.1
      - run: workflow-sentinel --sarif fixtures/repairable/findings.zizmor-1.30.1.sarif --repo fixtures/repairable --validate-repairs > /tmp/validation.json
      - run: python -c "import json; r=json.load(open('/tmp/validation.json')); v=r['packets'][0]['static_validation']; assert v['status']=='validated' and v['target_removed'] and v['new_findings']==0"
      - run: python evaluation/run.py --scanner "$(command -v zizmor)" --output /tmp/evaluation-regression.json
      - run: workflow-sentinel --sarif fixtures/repairable/findings.zizmor-1.30.1.sarif --repo fixtures/repairable --agent-script examples/agent-script.json --scanner "$(command -v zizmor)" > /tmp/agent.json
      - run: python -c "import json; r=json.load(open('/tmp/agent.json')); assert r['decision']=='review' and r['report']['packets'][0]['static_validation']['status']=='validated'"
